name: UI tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:
    inputs:
      browsers:
        description: "Comma-separated browsers"
        default: "chromium,firefox,webkit"
      markers:
        description: "Optional pytest -m expression, e.g. smoke"
        default: ""

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BROWSERS: ${{ inputs.browsers || 'chromium,firefox,webkit' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browsers and their system dependencies
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run the suite in parallel
        run: pytest -n auto ${{ inputs.markers && format('-m "{0}"', inputs.markers) || '' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

      - name: Upload screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: test-results
          retention-days: 14

  report:
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Fetch the previous report for trend history
        uses: actions/checkout@v4
        continue-on-error: true # the gh-pages branch does not exist before the first publish
        with:
          ref: gh-pages
          path: previous-report

      - name: Carry over history
        run: |
          if [ -d previous-report/history ]; then
            cp -r previous-report/history allure-results/history
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate the Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
