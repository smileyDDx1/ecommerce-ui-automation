[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --alluredir=allure-results --clean-alluredir
markers =
    smoke: critical-path checks to run first
    login: login and session handling
    inventory: product listing, sorting and detail pages
    cart: adding, removing and reviewing cart items
    checkout: checkout form, order totals and completion
    e2e: full user journeys across several pages
